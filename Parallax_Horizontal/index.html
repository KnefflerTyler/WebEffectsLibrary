<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Horizontal</title>
  <script src="../preview.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #020310;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── Parallax scene (fixed, behind everything) ── */
    .parallax-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .parallax-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-repeat: repeat-x;
      background-size: auto 100%;
      background-position: 0 0;
      will-change: transform;
    }

    #layer1 { background-image: url('assets/images/bg1.svg'); }
    #layer2 { background-image: url('assets/images/bg2.svg'); }

    /* ── Speed label tweak for px/s ── */
    .speed-value { min-width: 42px; }

    /* ── Settings button ── */
    .settings-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(5, 3, 20, 0.55);
      color: rgba(255,255,255,0.85);
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      background: rgba(5, 3, 20, 0.80);
      border-color: rgba(255,255,255,0.55);
      transform: rotate(30deg);
    }

    .settings-btn.active {
      transform: rotate(90deg);
      border-color: rgba(160,130,255,0.6);
    }

    /* ── Settings panel ── */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100vh;
      z-index: 199;
      background: rgba(6, 4, 22, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 72px 24px 32px;
      transition: right 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .settings-panel.open {
      right: 0;
    }

    .settings-panel h2 {
      color: rgba(255,255,255,0.95);
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    /* Layer card */
    .layer-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .layer-card-title {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .layer-preview {
      width: 100%;
      height: 72px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.07);
      background-size: cover;
      background-position: center;
      background-color: rgba(255,255,255,0.03);
      margin-bottom: 14px;
      transition: background-image 0.2s;
    }

    /* Speed row */
    .speed-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .speed-label {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
      width: 40px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      cursor: pointer;
      accent-color: #8b6fef;
      border-radius: 2px;
    }

    .speed-value {
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* File upload button */
    .upload-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .upload-label {
      display: block;
      width: 100%;
      padding: 9px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: background 0.18s, border-color 0.18s;
      user-select: none;
    }

    .upload-label:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.22);
    }

    .upload-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
    }

    /* Reset button */
    .reset-btn {
      display: block;
      width: 100%;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid rgba(255, 90, 90, 0.25);
      color: rgba(255, 130, 130, 0.7);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }

    .reset-btn:hover {
      background: rgba(255, 90, 90, 0.08);
      border-color: rgba(255, 90, 90, 0.45);
      color: rgba(255, 160, 160, 0.9);
    }

    /* Remove layer button */
    .layer-card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remove-layer-btn {
      background: transparent;
      border: none;
      color: rgba(255, 130, 130, 0.55);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .remove-layer-btn:hover {
      color: rgba(255, 90, 90, 0.9);
      background: rgba(255, 90, 90, 0.1);
    }

    /* Add layer button */
    .add-layer-btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      background: rgba(139, 111, 239, 0.1);
      border: 1px dashed rgba(139, 111, 239, 0.4);
      color: rgba(180, 160, 255, 0.85);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      margin-top: 4px;
    }

    .add-layer-btn:hover {
      background: rgba(139, 111, 239, 0.2);
      border-color: rgba(139, 111, 239, 0.7);
      color: rgba(200, 185, 255, 1);
    }


  </style>
</head>
<body>

  <!-- Parallax layers -->
  <div class="parallax-scene">
    <div class="parallax-layer" id="layer1"></div>
    <div class="parallax-layer" id="layer2"></div>
  </div>



  <!-- Settings toggle -->
  <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Open settings">
    ⚙
  </button>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Parallax settings">
    <h2>Parallax Settings</h2>

    <div id="layerCards">

    <!-- Layer 1 -->
    <div class="layer-card">
      <div class="layer-card-title"><span>Layer 1 — Background</span></div>
      <div class="layer-preview" id="preview1"></div>
      <div class="speed-row">
        <span class="speed-label">Speed</span>
        <input type="range" id="speed1" min="0" max="3" step="0.05" value="0.5" aria-label="Layer 1 speed">
        <span class="speed-value" id="speedVal1">0.50 px/f</span>
      </div>
      <div class="upload-wrapper">
        <label class="upload-label" for="fileInput1">↑ Upload Image</label>
        <input type="file" class="upload-input" id="fileInput1" accept="image/*">
      </div>
      <button class="reset-btn" id="reset1">Reset to default</button>
    </div>

    <!-- Layer 2 -->
    <div class="layer-card">
      <div class="layer-card-title"><span>Layer 2 — Foreground</span></div>
      <div class="layer-preview" id="preview2"></div>
      <div class="speed-row">
        <span class="speed-label">Speed</span>
        <input type="range" id="speed2" min="0" max="3" step="0.05" value="1.2" aria-label="Layer 2 speed">
        <span class="speed-value" id="speedVal2">1.20 px/f</span>
      </div>
      <div class="upload-wrapper">
        <label class="upload-label" for="fileInput2">↑ Upload Image</label>
        <input type="file" class="upload-input" id="fileInput2" accept="image/*">
      </div>
      <button class="reset-btn" id="reset2">Reset to default</button>
    </div>

    </div><!-- /layerCards -->

    <button class="add-layer-btn" id="addLayerBtn">+ Add Layer</button>
  </div>


  <script src="../back-button.js"></script>
  <script src="js/parallax.js"></script>
</body>
</html>
