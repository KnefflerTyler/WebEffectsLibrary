<!DOCTYPE html>
<html>
    <head>
        <title>Hex Voxel Terrain</title>
        <script src="../preview.js"></script>
        <script defer src="../back-button.js"></script>
        <link rel="stylesheet" href="../settings.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
            #pageBackground { position: fixed; inset: 0; overflow: hidden; }

            #hud {
                position: fixed;
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255,255,255,0.35);
                font-family: 'Segoe UI', system-ui, sans-serif;
                font-size: 0.78rem;
                letter-spacing: 0.06em;
                pointer-events: none;
                user-select: none;
                transition: opacity 0.6s;
            }
            #hud.hidden { opacity: 0; }
        </style>
    </head>
    <body>

        <div id="pageBackground"></div>

        <div id="hud">AUTO MODE &nbsp;·&nbsp; OPEN ⚙ TO ENABLE MANUAL INPUT</div>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Terrain settings">
            <h2>Hex Voxel Terrain Settings</h2>

            <!-- Controls -->
            <div class="sp-card">
                <div class="sp-card-title">Controls</div>
                <div class="sp-row">
                    <span class="sp-label">Mode</span>
                    <select class="sp-select" id="cfgControlMode">
                        <option value="auto" selected>Auto (forward)</option>
                        <option value="manual">Manual (WASD + mouse)</option>
                    </select>
                </div>
            </div>

            <!-- Camera -->
            <div class="sp-card">
                <div class="sp-card-title">Camera</div>
                <div class="sp-row">
                    <span class="sp-label">Speed</span>
                    <input type="range" class="sp-range" id="cfgMoveSpeed"
                           min="2" max="120" step="1" value="14">
                    <span class="sp-val" id="valMoveSpeed">14</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">View Dist</span>
                    <input type="range" class="sp-range" id="cfgViewDistance"
                           min="1" max="128" step="1" value="6">
                    <span class="sp-val" id="valViewDistance">6</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Hex Size</span>
                    <input type="range" class="sp-range" id="cfgHexSize"
                           min="0.5" max="8" step="0.1" value="1.2">
                    <span class="sp-val" id="valHexSize">1.2</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Height Step</span>
                    <input type="range" class="sp-range" id="cfgHeightStep"
                           min="0.5" max="8" step="0.1" value="1">
                    <span class="sp-val" id="valHeightStep">1.0</span>
                </div>
            </div>

            <!-- Fog -->
            <div class="sp-card">
                <div class="sp-card-title">Fog</div>
                <div class="sp-row">
                    <span class="sp-label">Near</span>
                    <input type="range" class="sp-range" id="cfgFogNear"
                           min="10" max="500" step="1" value="50">
                    <span class="sp-val" id="valFogNear">50</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Far</span>
                    <input type="range" class="sp-range" id="cfgFogFar"
                           min="20" max="1000" step="1" value="140">
                    <span class="sp-val" id="valFogFar">140</span>
                </div>
            </div>

            <!-- Lighting -->
            <div class="sp-card">
                <div class="sp-card-title">Lighting</div>
                <div class="sp-row">
                    <span class="sp-label">Ambient</span>
                    <input type="range" class="sp-range" id="cfgAmbient"
                           min="0" max="100" step="1" value="22">
                    <span class="sp-val" id="valAmbient">22</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Brightness</span>
                    <input type="range" class="sp-range" id="cfgBrightness"
                           min="0" max="200" step="1" value="100">
                    <span class="sp-val" id="valBrightness">100</span>
                </div>
            </div>

            <!-- Noise -->
            <div class="sp-card">
                <div class="sp-card-title">Noise</div>
                <div class="sp-row">
                    <span class="sp-label">Scale</span>
                    <input type="range" class="sp-range" id="cfgNoiseScale"
                           min="10" max="500" step="1" value="60">
                    <span class="sp-val" id="valNoiseScale">60</span>
                </div>
            </div>

            <!-- Colors -->
            <div class="sp-card">
                <div class="sp-card-title">Colors</div>
                <div class="sp-row">
                    <span class="sp-label">Grass Lo</span>
                    <input type="color" class="sp-color" id="cfgColorGrass" value="#2d5a1f">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Grass Hi</span>
                    <input type="color" class="sp-color" id="cfgColorPeak"  value="#6b8f5a">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Dirt Lo</span>
                    <input type="color" class="sp-color" id="cfgColorDirt"  value="#4a3020">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Rock Hi</span>
                    <input type="color" class="sp-color" id="cfgColorRock"  value="#756050">
                </div>
            </div>

            <!-- Debug -->
            <div class="sp-card">
                <div class="sp-card-title">Debug</div>
                <div class="sp-row">
                    <span class="sp-label">Wireframe</span>
                    <input type="checkbox" class="sp-check" id="cfgWireframe">
                </div>
            </div>
        </div>

        <script type="module" src="js/main.js"></script>

        <script>
            document.addEventListener('pointerlockchange', () => {
                const hud = document.getElementById('hud');
                if (document.pointerLockElement) {
                    hud.classList.add('hidden');
                } else {
                    hud.classList.remove('hidden');
                }
            });
        </script>
    </body>
</html>
