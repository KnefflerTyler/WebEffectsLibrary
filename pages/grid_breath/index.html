<!DOCTYPE html>
<html>
    <head>
        <title>Grid Breath</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
            #pageBackground { position: fixed; inset: 0; overflow: hidden; }
        </style>
        <script>(function(){var v=localStorage.getItem('gb:cfgBgColor');if(v)document.documentElement.style.background=v;})();</script>
    </head>
    <body>
        <div id="pageBackground"></div>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Grid Breath settings">
            <h2>Grid Breath Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Colors</div>
                <div class="sp-row"><span class="sp-label">Background</span><input type="color" class="sp-color" id="cfgBgColor" value="#0a0e14"></div>
                <div class="sp-row"><span class="sp-label">Base</span><input type="color" class="sp-color" id="cfgColor" value="#1a3a5c"></div>
                <div class="sp-row"><span class="sp-label">Hover</span><input type="color" class="sp-color" id="cfgHoverColor" value="#56b4f5"></div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Points</div>
                <div class="sp-row">
                    <span class="sp-label">Size</span>
                    <input type="range" class="sp-range" id="cfgPointSize" min="1" max="20" step="0.5" value="5">
                    <span class="sp-val" id="valPointSize">5</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Hover Scale</span>
                    <input type="range" class="sp-range" id="cfgHoverScale" min="0" max="4" step="0.1" value="1.5">
                    <span class="sp-val" id="valHoverScale">1.5</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Radius</span>
                    <input type="range" class="sp-range" id="cfgRadius" min="1" max="20" step="0.5" value="6">
                    <span class="sp-val" id="valRadius">6</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Density</span>
                    <input type="range" class="sp-range" id="cfgDensity" min="8" max="60" step="1" value="28">
                    <span class="sp-val" id="valDensity">28</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Ripple</div>
                <div class="sp-row">
                    <span class="sp-label">Enabled</span>
                    <input type="checkbox" class="sp-check" id="cfgRipple" checked>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Speed</span>
                    <input type="range" class="sp-range" id="cfgRippleSpeed" min="1" max="20" step="0.5" value="6">
                    <span class="sp-val" id="valRippleSpeed">6</span>
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
        </div>

        <script src="../../shared/back-button.js"></script>
        <script type="module" src="js/gridBreath.js"></script>
    </body>
</html>
