<!DOCTYPE html>
<html>
    <head>
        <title>Default Cube</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
            #pageBackground { position: fixed; inset: 0; overflow: hidden; }
            .face-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .face-row { display: flex; align-items: center; gap: 8px; }
            .face-label { color: rgba(255,255,255,0.4); font-size: 11px; min-width: 28px; }
        </style>
    </head>
    <body>
        <div id="pageBackground"></div>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Cube settings">
            <h2>Cube Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Animation</div>
                <div class="sp-row">
                    <span class="sp-label">Spinning</span>
                    <input type="checkbox" class="sp-check" id="cfgSpinning" checked>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Speed X</span>
                    <input type="range" class="sp-range" id="cfgSpeedX" min="0" max="0.05" step="0.001" value="0.007">
                    <span class="sp-val" id="valSpeedX">0.007</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Speed Y</span>
                    <input type="range" class="sp-range" id="cfgSpeedY" min="0" max="0.05" step="0.001" value="0.012">
                    <span class="sp-val" id="valSpeedY">0.012</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Face Colors</div>
                <div class="sp-row">
                    <span class="sp-label">Solid</span>
                    <input type="checkbox" class="sp-check" id="cfgSolid">
                    <input type="color" class="sp-color" id="cfgSolidColor" value="#ffffff" style="margin-left:auto">
                </div>
                <div class="face-grid" id="faceColorGrid">
                    <div class="face-row"><span class="face-label">+X</span><input type="color" class="sp-color" data-face="0" value="#ff4d6d"></div>
                    <div class="face-row"><span class="face-label">-X</span><input type="color" class="sp-color" data-face="1" value="#4dc8ff"></div>
                    <div class="face-row"><span class="face-label">+Y</span><input type="color" class="sp-color" data-face="2" value="#4dff91"></div>
                    <div class="face-row"><span class="face-label">-Y</span><input type="color" class="sp-color" data-face="3" value="#ffd14d"></div>
                    <div class="face-row"><span class="face-label">+Z</span><input type="color" class="sp-color" data-face="4" value="#c04dff"></div>
                    <div class="face-row"><span class="face-label">-Z</span><input type="color" class="sp-color" data-face="5" value="#ff8c4d"></div>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Lighting</div>
                <div class="sp-row">
                    <span class="sp-label">Shininess</span>
                    <input type="range" class="sp-range" id="cfgShiny" min="1" max="256" step="1" value="64">
                    <span class="sp-val" id="valShiny">64</span>
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
        </div>

        <script src="../../shared/back-button.js"></script>
        <script type="module" src="js/default.js"></script>
    </body>
</html>
