<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flock Simulation</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css"/>
        <link rel="stylesheet" href="css/style.css"/>
        <script src="../../shared/back-button.js"></script>
    </head>
    <body>
        <div id="loadingOverlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07080b;z-index:9999;">
            <div style="text-align:center;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial;">
                <div id="loadingText" style="margin-bottom:12px;font-size:16px;">Loading sprites: 0%</div>
                <div style="width:320px;height:12px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;">
                    <div id="loadingBar" style="width:0%;height:100%;background:linear-gradient(90deg,#40c4ff,#7ef0a6);transition:width 150ms linear;"></div>
                </div>
            </div>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <!-- Settings gear -->
        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">&#9881;</button>

        <!-- Settings panel -->
        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Flock simulation settings">
            <h2>Flock Settings</h2>
            <div class="sp-card">
                <div class="sp-row">
                    <div class="sp-label">Debug</div>
                    <label style="display:flex;align-items:center;gap:8px;">
                        <input id="cfgDebugColliders" class="sp-check" type="checkbox" />
                        <span style="color:rgba(255,255,255,0.75);font-size:13px;">Show collider outlines</span>
                    </label>
                </div>
            </div>
            <div class="sp-card">
                <div class="sp-row">
                    <div class="sp-label">Run</div>
                    <div style="flex:1;display:flex;justify-content:flex-end;">
                        <button id="cfgPauseBtn" class="sp-apply" type="button">Pause</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="js/main.js"></script>
    </body> 
</html>
