<!DOCTYPE html>
<html lang="en">
    <head>
        <title>2D Collisions</title>
        <script src="../../shared/preview.js"></script>
        <script defer src="../../shared/back-button.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
            canvas { display: block; }
        </style>
    </head>
    <body>

        <canvas id="c"></canvas>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Simulation settings">
            <h2>2D Collisions Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Physics</div>
                <div class="sp-row">
                    <span class="sp-label">Gravity</span>
                    <input type="number" class="sp-number" id="cfgGravity"
                           min="50" max="3000" step="50" value="600">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Bounciness</span>
                    <input type="number" class="sp-number" id="cfgRestitution"
                           min="0" max="100" step="5" value="55">
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Spawn</div>
                <div class="sp-row">
                    <span class="sp-label">Rate / s</span>
                    <input type="number" class="sp-number" id="cfgSpawnRate"
                           min="0.5" max="15" step="0.5" value="2">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Min Radius</span>
                    <input type="number" class="sp-number" id="cfgBallMinR"
                           min="4" max="40" step="1" value="8">
                </div>
                <div class="sp-row">
                    <span class="sp-label">Max Radius</span>
                    <input type="number" class="sp-number" id="cfgBallMaxR"
                           min="8" max="60" step="1" value="22">
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Obstacles</div>
                <div class="sp-row">
                    <span class="sp-label">Count</span>
                    <input type="number" class="sp-number" id="cfgNumObstacles"
                           min="2" max="40" step="1" value="14">
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
            <button class="sp-apply" id="cfgRegen"
                    style="margin-top:6px;background:rgba(255,255,255,0.06);">
                Regenerate Obstacles
            </button>
        </div>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
