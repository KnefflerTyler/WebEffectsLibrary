<!DOCTYPE html>
<html>
    <head>
        <title>2D Fireworks</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css">
        <link rel="stylesheet" href="../../shared/base.css">
        <script src="../../shared/back-button.js"></script>
        <style>
            body { background: #000010; }
        </style>
        <script>(function(){var v=localStorage.getItem('fw:cfgBgColor');if(v)document.documentElement.style.background=v;})();</script>
    </head>
    <body>
        <div id="pageBackground"></div>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">&#9881;</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Fireworks settings">
            <h2>Fireworks Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Launch</div>
                <div class="sp-row">
                    <span class="sp-label">Rate (ms)</span>
                    <input type="range" class="sp-range" id="cfgLaunchRate" min="200" max="3000" step="50" value="1200">
                    <span class="sp-val" id="valLaunchRate">1200</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Physics</div>
                <div class="sp-row">
                    <span class="sp-label">Gravity</span>
                    <input type="range" class="sp-range" id="cfgGravity" min="50" max="700" step="10" value="320">
                    <span class="sp-val" id="valGravity">320</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Sparks</div>
                <div class="sp-row">
                    <span class="sp-label">Count</span>
                    <input type="range" class="sp-range" id="cfgSparkCount" min="50" max="400" step="10" value="200">
                    <span class="sp-val" id="valSparkCount">200</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Lifetime</span>
                    <input type="range" class="sp-range" id="cfgSparkLife" min="0.5" max="6" step="0.1" value="2.2">
                    <span class="sp-val" id="valSparkLife">2.2</span>
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
        </div>
        <script type="module">
            import { startFireworks } from './js/fireworks.js';
            startFireworks('pageBackground');
        </script>
    </body>
</html>
