<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OBJ Viewer</title>
    <script src="../../shared/preview.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #c8d6e8;
        }

        #pageBackground {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* ── Upload overlay ──────────────────────────────────────────────── */
        #ui {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(10, 14, 20, 0.82);
            backdrop-filter: blur(6px);
            transition: opacity 0.4s;
        }

        #ui.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
            padding: 40px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            width: min(520px, 92vw);
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #e2ecf8;
            text-align: center;
        }

        .zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ── Drop zones ──────────────────────────────────────────────────── */
        .zone {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px 12px;
            border: 1.5px dashed rgba(255,255,255,0.18);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            min-height: 120px;
            text-align: center;
        }

        .zone:hover, .zone.drag-over {
            border-color: rgba(74, 158, 255, 0.6);
            background: rgba(74, 158, 255, 0.06);
        }

        .zone.has-file {
            border-color: rgba(74, 255, 140, 0.55);
            background: rgba(74, 255, 140, 0.04);
        }

        /* Let all events pass through children to the zone itself */
        .zone > * {
            pointer-events: none;
        }

        .zone input[type="file"] {
            display: none;
        }

        .zone-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .zone-title {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8aafcc;
        }

        .zone-sub {
            font-size: 0.72rem;
            color: #4a6a82;
        }

        .zone-filename {
            font-size: 0.72rem;
            color: #74d98a;
            word-break: break-all;
            max-width: 100%;
        }

        /* ── Texture hint ────────────────────────────────────────────────── */
        .texture-hint {
            font-size: 0.72rem;
            color: #4a6a82;
            text-align: center;
        }

        /* ── Status ──────────────────────────────────────────────────────── */
        #status {
            font-size: 0.8rem;
            min-height: 1.2em;
            text-align: center;
        }

        /* ── Render button ───────────────────────────────────────────────── */
        #renderBtn {
            padding: 13px;
            background: #1b4f8a;
            border: none;
            border-radius: 9px;
            color: #e2ecf8;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        #renderBtn:hover:not(:disabled)  { background: #2563a8; }
        #renderBtn:active:not(:disabled) { transform: scale(0.98); }
        #renderBtn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ── Hint overlay ────────────────────────────────────────────────── */
        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            background: rgba(10,14,20,0.72);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.78rem;
            color: #6a8aaa;
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
        }

        #hint.hidden { display: none; }

        /* ── Settings panel ──────────────────────────────────────────────── */
        #settingsBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 30;
            width: 38px;
            height: 38px;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            color: #8aafcc;
            backdrop-filter: blur(6px);
            transition: background 0.15s, color 0.15s;
            user-select: none;
        }

        #settingsBtn:hover { background: rgba(26, 50, 80, 0.85); color: #c8d6e8; }
        #settingsBtn.open  { background: rgba(26, 50, 80, 0.95); color: #e2ecf8; }

        #settingsPanel {
            position: fixed;
            top: 60px;
            right: 16px;
            z-index: 30;
            min-width: 190px;
            padding: 10px 0;
            background: rgba(10, 14, 20, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
        }

        #settingsPanel.open { display: flex; }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 14px;
            font-size: 0.82rem;
            color: #c8d6e8;
        }

        .setting-row:hover { background: rgba(255,255,255,0.04); }

        .setting-divider {
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 4px 0;
        }

        .setting-action { cursor: pointer; color: #8aafcc; }
        .setting-action:hover { color: #c8d6e8; }

        /* View mode select */
        .setting-select {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            color: #c8d6e8;
            font-size: 0.78rem;
            padding: 3px 6px;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            min-width: 100px;
            text-align: right;
        }

        .setting-select:hover { background: rgba(255,255,255,0.11); }
        .setting-select option { background: #0d1520; }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 34px;
            height: 18px;
            flex-shrink: 0;
        }

        .toggle input { opacity: 0; width: 0; height: 0; }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.12);
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle input:checked + .toggle-track { background: #2563a8; }

        .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: #c8d6e8;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked + .toggle-track::after { transform: translateX(16px); }
    </style>
</head>
<body>
    <div id="pageBackground"></div>

    <!-- Upload UI -->
    <div id="ui">
        <div class="card">
            <h1>OBJ Viewer</h1>

            <div class="zones">
                <!-- OBJ zone -->
                <div class="zone" id="objZone">
                    <span class="zone-icon">📦</span>
                    <span class="zone-title">.OBJ</span>
                    <span class="zone-sub">Required</span>
                    <span class="zone-filename" id="objLabel">Drop or click to browse</span>
                    <input type="file" id="objInput" accept=".obj">
                </div>

                <!-- MTL zone -->
                <div class="zone" id="mtlZone">
                    <span class="zone-icon">🎨</span>
                    <span class="zone-title">.MTL</span>
                    <span class="zone-sub">Optional</span>
                    <span class="zone-filename" id="mtlLabel">Drop or click to browse</span>
                    <input type="file" id="mtlInput" accept=".mtl">
                </div>
            </div>

            <p class="texture-hint">Texture images referenced by the .mtl can be dropped into either zone.</p>

            <p id="status"></p>

            <button id="renderBtn" disabled>Render Model</button>
        </div>
    </div>

    <!-- Settings button + panel -->
    <button id="settingsBtn" title="Settings">⚙</button>
    <div id="settingsPanel">
        <div class="setting-row">
            <span>View Mode</span>
            <select class="setting-select" id="viewModeSelect">
                <option value="solid">Solid</option>
                <option value="unlit">Unlit</option>
                <option value="clay">Clay</option>
                <option value="normals">Normals</option>
                <option value="depth">Depth</option>
                <option value="wireframe">Wireframe</option>
            </select>
        </div>
        <div class="setting-row">
            <span>Auto-Rotate</span>
            <label class="toggle">
                <input type="checkbox" id="autoRotateCheck" checked>
                <span class="toggle-track"></span>
            </label>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row setting-action" id="backToUpload">
            <span>&#8592; Open File Select</span>
        </div>
    </div>

    <!-- Controls hint -->
    <div id="hint" class="hidden">Drag to orbit · Scroll to zoom · Right-drag to pan · Double-click to reopen upload</div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
    </script>
    <script src="../../shared/back-button.js"></script>
    <script type="module" src="js/objDisplay.js"></script>
</body>
</html>
