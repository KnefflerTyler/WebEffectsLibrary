<!DOCTYPE html>
<html>
    <head>
        <title>Perlin Noise Mask</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/base.css">
        <style>
            .layer {
                position: fixed;
                inset: 0;
            }

            /* WebGL canvas — fills the viewport, renders everything */
            #layerMask { z-index: 1; }

            /*
             * Hidden source element — this is snapshotted via SVG foreignObject
             * into a canvas texture. Edit HTML and CSS here freely.
             * visibility:hidden keeps layout intact without showing on screen.
             */
            #layerContent {
                visibility: hidden;
                pointer-events: none;
                z-index: 0;
                background: #000000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            /* ── Style the content however you like ── */
            #layerContent h1 {
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 9vw;
                font-weight: 900;
                letter-spacing: 0.05em;
                line-height: 1.1;
                text-align: center;
                color: rgba(255, 255, 255, 0.90);
            }

            #layerContent p {
                font-family: Arial, sans-serif;
                font-size: 2vw;
                color: rgba(255, 255, 255, 0.70);
                margin-top: 0.6em;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <!-- WebGL canvas — gradient + noise mask + content, all in one -->
        <canvas id="layerMask" class="layer"></canvas>

        <!--
            Hidden source — edit this HTML freely.
            It gets snapshotted with full CSS into a WebGL texture.
        -->
        <div id="layerContent" class="layer">
            <h1>PERLIN<br>NOISE<br>MASK</h1>
            <p>noise-revealed content</p>
        </div>

        <link rel="stylesheet" href="../../shared/settings.css">

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Perlin Noise settings">
            <h2>Noise Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Shape</div>
                <div class="sp-row">
                    <span class="sp-label">Scale</span>
                    <input type="range" class="sp-range" id="cfgScale" min="0.5" max="8" step="0.1" value="2">
                    <span class="sp-val" id="valScale">2.0</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Contrast</span>
                    <input type="range" class="sp-range" id="cfgContrast" min="0" max="4" step="0.1" value="1">
                    <span class="sp-val" id="valContrast">1.0</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Amplitude</span>
                    <input type="range" class="sp-range" id="cfgAmplitude" min="0" max="2" step="0.05" value="1">
                    <span class="sp-val" id="valAmplitude">1.0</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Bias</span>
                    <input type="range" class="sp-range" id="cfgBias" min="-0.5" max="0.5" step="0.01" value="0">
                    <span class="sp-val" id="valBias">0.00</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Ridged</span>
                    <input type="checkbox" class="sp-check" id="cfgRidged">
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Animation</div>
                <div class="sp-row">
                    <span class="sp-label">Speed</span>
                    <input type="range" class="sp-range" id="cfgSpeed" min="0" max="1" step="0.01" value="0.08">
                    <span class="sp-val" id="valSpeed">0.08</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Mask Edge</div>
                <div class="sp-row">
                    <span class="sp-label">Threshold</span>
                    <input type="range" class="sp-range" id="cfgThreshold" min="0" max="1" step="0.01" value="0.5">
                    <span class="sp-val" id="valThreshold">0.50</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Softness</span>
                    <input type="range" class="sp-range" id="cfgSoftness" min="0" max="0.5" step="0.005" value="0.02">
                    <span class="sp-val" id="valSoftness">0.020</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Warp</span>
                    <input type="range" class="sp-range" id="cfgWarp" min="0" max="2" step="0.05" value="0">
                    <span class="sp-val" id="valWarp">0.00</span>
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
        </div>

        <script src="../../shared/back-button.js"></script>
        <script type="module" src="js/default.js"></script>
    </body>
</html>
