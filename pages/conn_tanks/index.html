<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected Tanks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game-canvas" aria-label="Connected Tanks game"></canvas>

  <main id="menu" class="overlay">
    <section class="card">
      <p class="eyebrow">P2P WebGL demo</p>
      <h1>Connected Tanks</h1>
      <p class="subtitle">Create a room, share its invite link, then drive with WASD.</p>
      <input id="player-name" maxlength="18" placeholder="Your name" value="Player">
      <div class="actions">
        <button id="host-button">Create room</button>
      </div>
      <p id="menu-status" class="status"></p>
    </section>
  </main>

  <header id="hud" class="hidden">
    <button id="room-code" title="Copy invite link">Copy invite link</button>
    <span id="connection-status">Waiting for players</span>
    <span class="controls">WASD to drive</span>
  </header>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
