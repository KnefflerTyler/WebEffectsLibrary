<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected Tanks Level Editor</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="editor-page">
  <header class="editor-header">
    <div>
      <p class="eyebrow">Level editor</p>
      <h1>Connected Tanks</h1>
    </div>
    <nav class="editor-nav">
      <a class="button-link secondary" href="../index.html">Views</a>
      <a class="button-link" href="game.html">Game</a>
    </nav>
  </header>

  <main class="editor-shell">
    <section class="editor-panel">
      <div class="editor-toolbar">
        <button id="load-default">Load default</button>
        <label class="file-button">
          Import
          <input id="import-level" type="file" accept=".json,.level.json,application/json">
        </label>
        <button id="add-spawn">Add spawn</button>
        <button id="add-sprite">Add sprite</button>
        <label class="wrap-control"><input id="screen-wrap" type="checkbox"> Screen wrap</label>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="tool-button active" data-tool="select" aria-pressed="true">Select</button>
        <button class="tool-button" data-tool="line" aria-pressed="false">Line collider</button>
        <button class="tool-button" data-tool="rectangle" aria-pressed="false">Rectangle</button>
        <button class="tool-button" data-tool="ellipse" aria-pressed="false">Ellipse</button>
        <button id="delete-collider" class="danger" disabled>Delete selected</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <label class="color-control">Border <input id="border-color" type="color" value="#69e394"></label>
        <label class="alpha-control">Border alpha <input id="border-alpha" type="range" min="0" max="1" step="0.05" value="1"><output id="border-alpha-value">100%</output></label>
        <label class="color-control">Fill <input id="fill-color" type="color" value="#2d9e5b"></label>
        <label class="alpha-control">Fill alpha <input id="fill-alpha" type="range" min="0" max="1" step="0.05" value="0.25"><output id="fill-alpha-value">25%</output></label>
        <label class="wrap-control"><input id="destructible" type="checkbox"> Destructible</label>
        <label>Wall health <input id="destructible-health" type="number" min="1" max="99" step="1" value="2" disabled></label>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="format-json">Format</button>
        <button id="export-level">Export</button>
      </div>
      <details class="cave-generator">
        <summary>Cave generator</summary>
        <div class="cave-controls">
          <label>Columns <input id="cave-cols" type="number" min="12" max="256" value="96"></label>
          <label>Rows <input id="cave-rows" type="number" min="8" max="144" value="54"></label>
          <label>Wall fill <input id="cave-fill" type="range" min="25" max="70" value="45"><output id="cave-fill-value">45%</output></label>
          <label>Smoothing <input id="cave-iterations" type="range" min="1" max="10" value="5"><output id="cave-iterations-value">5</output></label>
          <label>Seed <input id="cave-seed" type="text" value="connected-tanks"></label>
          <label>Floor <input id="cave-floor-color" type="color" value="#152219"></label>
          <label>Walls <input id="cave-wall-color" type="color" value="#344638"></label>
          <label>Edges <input id="cave-edge-color" type="color" value="#6f8a72"></label>
          <button id="generate-cave">Generate cave</button>
        </div>
      </details>
      <div class="editor-workspace">
        <div class="level-stage" id="level-stage">
          <canvas id="level-canvas" aria-label="Level drawing surface"></canvas>
          <p class="canvas-hint">Drag to draw. Collider coordinates are saved from 0 to 1.</p>
        </div>
        <details class="json-panel">
          <summary>Level JSON</summary>
          <textarea id="level-json" spellcheck="false"></textarea>
        </details>
      </div>
      <p id="editor-status" class="status"></p>
    </section>

    <aside class="editor-panel editor-summary">
      <h2>Summary</h2>
      <dl>
        <div><dt>Level</dt><dd id="summary-name">-</dd></div>
        <div><dt>Spawns</dt><dd id="summary-spawns">0</dd></div>
        <div><dt>Objects</dt><dd id="summary-objects">0</dd></div>
        <div><dt>Colliders</dt><dd id="summary-colliders">0</dd></div>
      </dl>
      <h2>Spawns</h2>
      <ol id="spawn-list"></ol>
      <h2>Objects</h2>
      <ol id="object-list"></ol>
    </aside>
  </main>

  <script type="module" src="../js/editor/editor.js"></script>
</body>
</html>
