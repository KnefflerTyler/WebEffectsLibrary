<!DOCTYPE html>
<html>
    <head>
        <title>Shape Grid</title>
        <script src="../../shared/preview.js"></script>
        <link rel="stylesheet" href="../../shared/settings.css">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
            #pageBackground { position: fixed; inset: 0; overflow: hidden; }
        </style>
    </head>
    <body>
        <div id="pageBackground"></div>

        <button class="sp-btn" id="spBtn" title="Settings" aria-label="Open settings">⚙</button>

        <div class="sp-panel" id="spPanel" role="dialog" aria-label="Shape Grid settings">
            <h2>Shape Grid Settings</h2>

            <div class="sp-card">
                <div class="sp-card-title">Grid</div>
                <div class="sp-row">
                    <span class="sp-label">Shape</span>
                    <select class="sp-select" id="cfgShape">
                        <option value="hex" selected>Hexagon</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Cell Size</span>
                    <input type="range" class="sp-range" id="cfgCellSize" min="10" max="100" step="2" value="30">
                    <span class="sp-val" id="valCellSize">30</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Appearance</div>
                <div class="sp-row"><span class="sp-label">Color</span><input type="color" class="sp-color" id="cfgColor" value="#f7e4d2"></div>
                <div class="sp-row">
                    <span class="sp-label">Opacity</span>
                    <input type="range" class="sp-range" id="cfgOpacity" min="0" max="1" step="0.01" value="0.05">
                    <span class="sp-val" id="valOpacity">0.05</span>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Max Opacity</span>
                    <input type="range" class="sp-range" id="cfgMaxOpacity" min="0" max="1" step="0.01" value="0.75">
                    <span class="sp-val" id="valMaxOpacity">0.75</span>
                </div>
            </div>

            <div class="sp-card">
                <div class="sp-card-title">Effects</div>
                <div class="sp-row">
                    <span class="sp-label">Ripple</span>
                    <input type="checkbox" class="sp-check" id="cfgRipple" checked>
                </div>
                <div class="sp-row">
                    <span class="sp-label">Spotlight</span>
                    <input type="checkbox" class="sp-check" id="cfgSpotlight" checked>
                </div>
            </div>

            <button class="sp-apply" id="spApply">Apply</button>
        </div>

        <script src="../../shared/back-button.js"></script>
        <script type="module" src="js/shapeGrid.js"></script>
    </body>
</html>
