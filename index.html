<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Effects Library</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            background: #0a0e14;
            color: #c8d6e8;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        header {
            padding: 52px 48px 32px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #e2ecf8;
        }

        h1 span {
            color: rgba(255,255,255,0.3);
            font-weight: 400;
        }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 48px 64px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Effect card ── */
        .effect-card {
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            background: rgba(255,255,255,0.03);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .effect-card:hover {
            border-color: rgba(100,160,255,0.45);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }

        /* ── Iframe thumbnail ── */
        .thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #06080f;
            flex-shrink: 0;
        }

        .thumb-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: top left;
            border: none;
            pointer-events: none;
        }

        /* ── Label ── */
        .label {
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.78);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <header>
        <h1>Web Effects <span>Library</span></h1>
    </header>

    <main class="grid" id="grid"></main>

    <script>
        const effects = [
            { label: 'Default Cube',        href: 'default_cube/index.html' },
            { label: 'Galaxy',              href: 'galaxy/index.html' },
            { label: 'Grid Breath',         href: 'grid_breath/index.html' },
            { label: 'Shape Grid',          href: 'grid_shape/index.html' },
            { label: '3D Point Graph',      href: 'grid_3d_points/index.html' },
            { label: 'Perlin Mask',         href: 'perlin_noise_mask/index.html' },
            { label: 'OBJ Viewer',          href: 'obj_display/index.html' },
            { label: 'Parallax Horizontal', href: 'Parallax_Horizontal/index.html' },
            { label: 'Parallax Vertical',   href: 'Parallax_Vertical/index.html' },
        ];

        const grid = document.getElementById('grid');

        // ── Register service worker for asset caching ────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        effects.forEach(({ label, href }) => {
            // Resolve the iframe src relative to this page's directory
            const previewSrc = href + '?preview';

            const card = document.createElement('a');
            card.className = 'effect-card';
            card.href = href;

            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';

            const iframe = document.createElement('iframe');
            iframe.src = previewSrc;
            iframe.title = label + ' preview';
            iframe.setAttribute('loading', 'lazy');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            iframe.setAttribute('scrolling', 'no');

            // Scale the 1280×720 iframe down to fill the container.
            // The wrap's aspect-ratio:16/9 CSS handles its height automatically.
            function scaleIframe() {
                const containerW = wrap.clientWidth;
                if (!containerW) return;
                iframe.style.transform = `scale(${containerW / 1280})`;
            }

            wrap.appendChild(iframe);

            const labelEl = document.createElement('div');
            labelEl.className = 'label';
            labelEl.textContent = label;

            card.appendChild(wrap);
            card.appendChild(labelEl);
            grid.appendChild(card);

            // Scale after layout
            requestAnimationFrame(scaleIframe);
            window.addEventListener('resize', scaleIframe);
        });
    </script>
</body>
</html>
