<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Effects Library</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            background: #0a0e14;
            color: #c8d6e8;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        header {
            padding: 52px 48px 32px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #e2ecf8;
        }

        h1 span {
            color: rgba(255,255,255,0.3);
            font-weight: 400;
        }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 48px 64px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Effect card ── */
        .effect-card {
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            background: rgba(255,255,255,0.03);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .effect-card:hover {
            border-color: rgba(100,160,255,0.45);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }

        /* ── Iframe thumbnail ── */
        .thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #06080f;
            flex-shrink: 0;
        }

        .thumb-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: top left;
            border: none;
            pointer-events: none;
        }

        /* ── Static image thumbnail (used instead of iframe when image: is set) ── */
        .thumb-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ── Label ── */
        .label {
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.78);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        /* ── Heavy-preview toggle ── */
        .preview-toggle {
            position: absolute;
            top: 7px;
            right: 7px;
            z-index: 3;
            background: rgba(10,14,20,0.82);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: rgba(255,255,255,0.65);
            font-size: 0.78rem;
            padding: 3px 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            line-height: 1.5;
        }
        .preview-toggle:hover {
            background: rgba(27,79,138,0.85);
            border-color: rgba(74,158,255,0.5);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Web Effects <span>Library</span></h1>
    </header>

    <main class="grid" id="grid"></main>

    <script>
        const effects = [
            { label: 'Default Cube',        href: 'pages/default_cube/index.html' },
            { label: 'Galaxy',              href: 'pages/galaxy/index.html' },
            { label: 'Grid Breath',         href: 'pages/grid_breath/index.html' },
            { label: 'Shape Grid',          href: 'pages/grid_shape/index.html' },
            { label: '3D Point Graph',      href: 'pages/grid_3d_points/index.html' },
            { label: 'Perlin Mask',         href: 'pages/perlin_noise_mask/index.html' },
            { label: 'OBJ Viewer',          href: 'pages/obj_display/index.html' },
            { label: 'Parallax Horizontal', href: 'pages/Parallax_Horizontal/index.html' },
            { label: 'Parallax Vertical',   href: 'pages/Parallax_Vertical/index.html' },
            { label: 'Marching Cubes',      href: 'pages/marching_cubes/index.html',  heavy: true },
            { label: 'Hex Terrain',         href: 'pages/marching_hex/index.html',    heavy: true,    image: '/assets/images/image.png' },
            { label: 'Cubic Voxel Terrain', href: 'pages/voxel_cubes/index.html',     heavy: true },
            { label: 'Hex Voxel Terrain',   href: 'pages/voxel_hex/index.html',       heavy: true,    image: '/assets/images/image.png' },
            { label: '2D Collisions',       href: 'pages/2d_collisions/index.html' },
            { label: '2D Fireworks',        href: 'pages/2d_particals/index.html' },
            { label: 'Scroll Jack Web Example',   href: 'pages/scrolljack_web_sample/index.html' },
            { label: 'Progress Bar',        href: 'pages/scrolljack_progressbar/index.html' },
            { label: 'Carousel',            href: 'pages/scrolljack_carousel/index.html' },
            { label: 'Wind Tunnel',           href: 'pages/wind_tunnel/index.html' },
            { label: 'P2P Chat (manual)',      href: 'pages/conn_p2p-chat/index.html' },
            { label: 'P2P Chat (PeerJS)',      href: 'pages/conn_peerjs-chat/index.html' },
            { label: 'Multiplayer Conn Test',  href: 'pages/conn_stress_test/index.html' },
            { label: 'Connected Mice',         href: 'pages/conn_mice/index.html' },
            { label: 'Tic-Tac-Toe (P2P)',      href: 'pages/conn_ticktacktoe/index.html' },
        ];

        const grid = document.getElementById('grid');

        // ── Register service worker for asset caching ────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        // Sequential iframe load queue — each src is set only after the
        // previous iframe fires its load event (or times out after 15 s).
        const loadQueue = [];
        let queueRunning = false;

        function enqueueIframe(iframe, src, label) {
            loadQueue.push({ iframe, src, label });
            if (!queueRunning) drainQueue();
        }

        function drainQueue() {
            if (!loadQueue.length) { queueRunning = false; return; }
            queueRunning = true;
            const { iframe, src, label } = loadQueue.shift();
            let done = false;
            const t0 = performance.now();
            function next(timedOut = false) {
                if (done) return;
                done = true;
                const ms = (performance.now() - t0).toFixed(0);
                if (timedOut) {
                    console.warn(`[iframe] ${label} — timed out after ${ms} ms`);
                } else {
                    console.log(`[iframe] ${label} — loaded in ${ms} ms`);
                }
                drainQueue();
            }
            iframe.addEventListener('load', () => next(false), { once: true });
            // Safety timeout in case an iframe never fires load
            setTimeout(() => next(true), 3_000);
            iframe.src = src;
        }

        effects.forEach(({ label, href, heavy, image }) => {
            // Resolve the iframe src relative to this page's directory
            const previewSrc = href + '?preview';

            const card = document.createElement('a');
            card.className = 'effect-card';
            card.href = href;

            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';

            if (image) {
                // Static image — no iframe, no load queue
                const img = document.createElement('img');
                img.src   = image;
                img.alt   = label + ' preview';
                img.loading = 'lazy';
                img.decoding = 'async';
                wrap.appendChild(img);
            } else {
                const iframe = document.createElement('iframe');
                // src is set later via the load queue — not here
                iframe.title = label + ' preview';
                iframe.setAttribute('loading', 'lazy');
                iframe.setAttribute('scrolling', 'no');

                // Scale the 1280×720 iframe down to fill the container.
                // The wrap's aspect-ratio:16/9 CSS handles its height automatically.
                function scaleIframe() {
                    const containerW = wrap.clientWidth;
                    if (!containerW) return;
                    iframe.style.transform = `scale(${containerW / 1280})`;
                }

                wrap.appendChild(iframe);

                if (heavy) {
                // Iframe auto-pauses after a few frames via preview.js.
                // Toggle button lets the user resume / re-pause.
                let paused = true;

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'preview-toggle';
                toggleBtn.textContent = '\u23f8';
                toggleBtn.title = 'Pause preview';

                // preview.js notifies us when the auto-pause fires.
                window.addEventListener('message', e => {
                    if (e.source !== iframe.contentWindow) return;
                    if (e.data === 'preview-auto-paused') {
                        paused = true;
                        toggleBtn.textContent = '\u25b6';
                        toggleBtn.title = 'Resume preview';
                    }
                });

                toggleBtn.addEventListener('click', e => {
                    e.preventDefault();
                    if (paused) {
                        iframe.contentWindow?.postMessage('preview-resume', '*');
                        paused = false;
                        toggleBtn.textContent = '\u23f8';
                        toggleBtn.title = 'Pause preview';
                    } else {
                        iframe.contentWindow?.postMessage('preview-pause', '*');
                        paused = true;
                        toggleBtn.textContent = '\u25b6';
                        toggleBtn.title = 'Resume preview';
                    }
                });

                    wrap.appendChild(toggleBtn);
                }

                // Scale after layout
                requestAnimationFrame(scaleIframe);
                window.addEventListener('resize', scaleIframe);

                // Queue this iframe for sequential loading
                enqueueIframe(iframe, previewSrc, label);
            } // end else (iframe branch)

            const labelEl = document.createElement('div');
            labelEl.className = 'label';
            labelEl.textContent = label;

            card.appendChild(wrap);
            card.appendChild(labelEl);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
